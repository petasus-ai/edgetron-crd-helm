apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mediateddevices.kubevirt.io
spec:
  group: kubevirt.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                gpuResource:
                  type: boolean
                externalResourceProvider:
                  type: boolean
                mdevNameSelector:
                  type: string
                resourceName:
                  type: string
                description:
                  type: string
              required:
              - mdevNameSelector
              - resourceName
  scope: Cluster
  names:
    plural: mediateddevices
    singular: mediateddevice
    kind: MediatedDevice
    shortNames:
    - md
    - mds
