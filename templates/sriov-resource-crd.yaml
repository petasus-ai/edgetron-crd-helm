apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sriovresources.kubevirt.io
spec:
  group: kubevirt.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
              required:
              - name
  scope: Cluster
  names:
    plural: sriovresources
    singular: sriovresource
    kind: SriovResource
    shortNames:
    - sr
    - srs
