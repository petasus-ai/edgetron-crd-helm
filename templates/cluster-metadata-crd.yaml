apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustermetadatas.kubevirt.io
spec:
  group: kubevirt.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                type:
                  type: string
                vendor:
                  type: string
                version:
                  type: string
                compatibility:
                  type: array
                  items:
                    type: string
  scope: Cluster
  names:
    plural: clustermetadatas
    singular: clustermetadata
    kind: ClusterMetadata
    shortNames:
    - cmd
    - cmds
