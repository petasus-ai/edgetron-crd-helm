apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sites.petasus.io
spec:
  group: petasus.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - lat
                - lng
              properties:
                alias:
                  type: string
                place:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: object
                      properties:
                        en:
                          type: string
                        ko:
                          type: string
                        ja:
                          type: string
                    admin1:
                      type: object
                      properties:
                        en:
                          type: string
                        ko:
                          type: string
                        ja:
                          type: string
                    countryCode:
                      type: string
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                hostCodes:
                  type: array
                  items:
                    type: string
      additionalPrinterColumns:
        - name: Alias
          type: string
          jsonPath: .spec.alias
        - name: Place
          type: string
          jsonPath: .spec.place.name.en
        - name: Country
          type: string
          jsonPath: .spec.place.countryCode
        - name: Lat
          type: number
          jsonPath: .spec.lat
        - name: Lng
          type: number
          jsonPath: .spec.lng
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Cluster
  names:
    plural: sites
    singular: site
    kind: Site
    shortNames:
    - psite
    - psites
