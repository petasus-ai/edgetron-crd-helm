apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flavors.kubevirt.io
spec:
  group: kubevirt.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                family:
                  type: string
                description:
                  type: string
                vcpus:
                  type: integer
                ram:
                  type: integer
                rootDisk:
                  type: integer
                ephemeralDisk:
                  type: integer
                extraSpecs:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                gpus:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      quantity:
                        type: integer
                devices:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      quantity:
                        type: integer
  scope: Cluster
  names:
    plural: flavors
    singular: flavor
    kind: Flavor
    shortNames:
    - fv
    - fvs
