apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rttreferences.petasus.io
spec:
  group: petasus.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - method
                - lat
                - lng
              properties:
                displayName:
                  type: object
                  # by language code (en, ko, ja, zh, zh-TW, ...)
                  additionalProperties:
                    type: string
                place:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: object
                      # by language code (en, ko, ja, zh, zh-TW, ...)
                      additionalProperties:
                        type: string
                    admin1:
                      type: object
                      # by language code (en, ko, ja, zh, zh-TW, ...)
                      additionalProperties:
                        type: string
                    district:
                      type: object
                      # the levels between admin1 and the place (e.g. ko 성남시 분당구), by language
                      additionalProperties:
                        type: string
                    countryCode:
                      type: string
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                method:
                  type: string
                  enum:
                    - ip
                    - anchor
                    - manual
                ips:
                  type: array
                  items:
                    type: string
                anchor:
                  type: object
                  properties:
                    site:
                      type: string
                    offsetMs:
                      type: number
                      minimum: 0
                manual:
                  type: object
                  properties:
                    values:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          ms:
                            type: number
                            minimum: 0
                          enteredAt:
                            type: string
                tenantVisible:
                  type: boolean
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.displayName.en
        - name: Method
          type: string
          jsonPath: .spec.method
        - name: IPs
          type: string
          jsonPath: .spec.ips[*]
        - name: Tenant
          type: boolean
          jsonPath: .spec.tenantVisible
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Cluster
  names:
    plural: rttreferences
    singular: rttreference
    kind: RttReference
    shortNames:
    - rttref
    - rttrefs
