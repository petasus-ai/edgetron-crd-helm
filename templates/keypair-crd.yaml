apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keypairs.kubevirt.io
spec:
  group: kubevirt.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                publicKey:
                  type: string
  scope: Cluster
  names:
    plural: keypairs
    singular: keypair
    kind: KeyPair
    shortNames:
    - kp
    - kps
